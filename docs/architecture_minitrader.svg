<svg viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg" width="100%">
<title>MiniTrader 内部架构图（中文）</title>
<desc>MiniTrader 的模块组成、线程模型和数据流</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="340" y="28" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A" text-anchor="middle">MiniTrader 内部架构</text>

<rect x="40" y="48" width="290" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="63" font-family="sans-serif" font-size="11" fill="#0C447C" text-anchor="middle" dominant-baseline="central">线程 1：IO 线程（绑定 CPU 核心）</text>

<rect x="350" y="48" width="290" height="30" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="495" y="63" font-family="sans-serif" font-size="11" fill="#27500A" text-anchor="middle" dominant-baseline="central">线程 2：策略线程</text>

<rect x="52" y="92" width="264" height="180" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="68" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C" dominant-baseline="central">网络层 (network/)</text>

<rect x="68" y="126" width="232" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="184" y="142" font-family="sans-serif" font-size="12" fill="#042C53" text-anchor="middle" dominant-baseline="central">行情接收器</text>
<text x="184" y="160" font-family="sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">epoll 边缘触发 + CPU 绑核</text>

<rect x="68" y="182" width="232" height="36" rx="8" fill="#E8EEF6" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="5,3"/>
<text x="160" y="198" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle" dominant-baseline="central">协议解码（零拷贝）</text>
<text x="268" y="198" font-family="sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">TODO</text>
<text x="184" y="212" font-family="sans-serif" font-size="10" fill="#888780" text-anchor="middle" dominant-baseline="central">接口已定义，decoder 待实现</text>

<rect x="68" y="230" width="232" height="30" rx="6" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="184" y="245" font-family="sans-serif" font-size="11" fill="#042C53" text-anchor="middle" dominant-baseline="central">纳秒级时间戳打标</text>

<rect x="180" y="292" width="200" height="48" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="280" y="310" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">SPSC 无锁队列</text>
<text x="280" y="330" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">cache-line 填充 · memory_order</text>

<polyline points="184,272 184,316 180,316" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>
<polyline points="380,316 410,316 410,370" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>

<rect x="340" y="92" width="280" height="180" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="356" y="112" font-family="sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">策略层 (strategy/)</text>

<rect x="356" y="126" width="248" height="44" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="480" y="142" font-family="sans-serif" font-size="12" fill="#173404" text-anchor="middle" dominant-baseline="central">策略基类 (StrategyBase)</text>
<text x="480" y="160" font-family="sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">on_tick() · on_fill() · 回测/实盘切换</text>

<rect x="356" y="182" width="120" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="416" y="200" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">价差策略示例</text>

<rect x="490" y="182" width="114" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="547" y="200" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">自定义策略</text>

<rect x="356" y="230" width="248" height="30" rx="6" fill="#97C459" stroke="#3B6D11" stroke-width="0.5"/>
<text x="480" y="245" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">submit_order() → 风控 → 报单网关</text>

<rect x="120" y="370" width="200" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="136" y="390" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" dominant-baseline="central">订单簿 (orderbook/)</text>
<rect x="136" y="402" width="168" height="20" rx="4" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="412" font-family="sans-serif" font-size="11" fill="#26215C" text-anchor="middle" dominant-baseline="central">平坦数组 · O(1) 价格定位</text>
<rect x="136" y="428" width="168" height="18" rx="4" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="437" font-family="sans-serif" font-size="11" fill="#26215C" text-anchor="middle" dominant-baseline="central">撮合引擎 · 价格时间优先</text>
<text x="136" y="458" font-family="sans-serif" font-size="10" fill="#534AB7" dominant-baseline="central">回测：仿真撮合引擎</text>
<text x="136" y="470" font-family="sans-serif" font-size="10" fill="#888780" dominant-baseline="central">实盘：本地 L2 快照维护</text>

<rect x="370" y="370" width="200" height="80" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="386" y="390" font-family="sans-serif" font-size="13" font-weight="500" fill="#791F1F" dominant-baseline="central">风控网关 (risk/)</text>
<rect x="386" y="402" width="168" height="20" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="470" y="412" font-family="sans-serif" font-size="11" fill="#501313" text-anchor="middle" dominant-baseline="central">内联检查 · O(1) · 不可绕过</text>
<rect x="386" y="428" width="168" height="18" rx="4" fill="#F09595" stroke="#A32D2D" stroke-width="0.5"/>
<text x="470" y="437" font-family="sans-serif" font-size="11" fill="#501313" text-anchor="middle" dominant-baseline="central">仓位 · 频率 · 撤单率 · 自成交</text>

<polyline points="410,272 350,320 280,370" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
<polyline points="480,262 480,370" fill="none" stroke="#A32D2D" stroke-width="1" marker-end="url(#arr)"/>

<rect x="160" y="500" width="340" height="44" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="330" y="516" font-family="sans-serif" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">报单网关（模拟）</text>
<text x="330" y="534" font-family="sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">编码 → 发送 → 成交回报</text>

<polyline points="470,450 470,500" fill="none" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>

<rect x="160" y="562" width="340" height="30" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="330" y="577" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">性能测试 — Google Benchmark + perf 火焰图</text>
</svg>
