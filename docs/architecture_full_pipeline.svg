<svg viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg" width="100%">
<title>量化交易系统全链路架构图（含延迟与优化策略）</title>
<desc>每层标注典型延迟和核心优化手段</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="260" y="28" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">量化交易系统全链路架构</text>

<rect x="40" y="50" width="420" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250" y="70" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">交易所 / 行情源</text>
<text x="250" y="88" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">上交所 · 深交所 · 中金所 · 组播/TCP</text>

<text x="480" y="68" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">光速传输 ~3-5 us/km</text>
<text x="480" y="84" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">co-location 托管机房</text>

<line x1="250" y1="100" x2="250" y2="118" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="118" width="420" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="136" font-family="sans-serif" font-size="12" font-weight="500" fill="#0C447C" dominant-baseline="central">行情接入层</text>
<rect x="56" y="148" width="92" height="30" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="102" y="163" font-family="sans-serif" font-size="11" fill="#042C53" text-anchor="middle" dominant-baseline="central">网卡收包</text>
<rect x="158" y="148" width="92" height="30" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="204" y="163" font-family="sans-serif" font-size="11" fill="#042C53" text-anchor="middle" dominant-baseline="central">协议解码</text>
<rect x="260" y="148" width="92" height="30" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="306" y="163" font-family="sans-serif" font-size="11" fill="#042C53" text-anchor="middle" dominant-baseline="central">时间戳打标</text>
<rect x="362" y="148" width="86" height="30" rx="5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="405" y="163" font-family="sans-serif" font-size="11" fill="#042C53" text-anchor="middle" dominant-baseline="central">行情分发</text>

<text x="480" y="132" font-family="sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">~1-3 us（优化后）</text>
<text x="480" y="148" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">DPDK/内核旁路</text>
<text x="480" y="164" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">SO_TIMESTAMPING 硬件时间戳</text>
<text x="480" y="180" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">零拷贝解码 + SIMD</text>

<line x1="250" y1="190" x2="250" y2="208" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="208" width="420" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="226" font-family="sans-serif" font-size="12" font-weight="500" fill="#3C3489" dominant-baseline="central">数据处理层</text>
<rect x="56" y="238" width="100" height="30" rx="5" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="106" y="253" font-family="sans-serif" font-size="11" fill="#26215C" text-anchor="middle" dominant-baseline="central">OrderBook维护</text>
<rect x="166" y="238" width="80" height="30" rx="5" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="206" y="253" font-family="sans-serif" font-size="11" fill="#26215C" text-anchor="middle" dominant-baseline="central">因子计算</text>
<rect x="256" y="238" width="80" height="30" rx="5" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="296" y="253" font-family="sans-serif" font-size="11" fill="#26215C" text-anchor="middle" dominant-baseline="central">信号生成</text>
<rect x="346" y="238" width="100" height="30" rx="5" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="396" y="253" font-family="sans-serif" font-size="11" fill="#26215C" text-anchor="middle" dominant-baseline="central">Tick数据存储</text>

<text x="480" y="222" font-family="sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">~0.1-0.5 us（优化后）</text>
<text x="480" y="238" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">flat array O(1) 价格索引</text>
<text x="480" y="254" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">预分配内存 · 无 malloc</text>
<text x="480" y="270" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">因子增量更新（非全量重算）</text>

<line x1="250" y1="280" x2="250" y2="298" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="298" width="420" height="72" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="56" y="316" font-family="sans-serif" font-size="12" font-weight="500" fill="#27500A" dominant-baseline="central">策略引擎层</text>
<rect x="56" y="328" width="90" height="30" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="101" y="343" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">Alpha策略</text>
<rect x="156" y="328" width="110" height="30" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="211" y="343" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">执行算法(TWAP)</text>
<rect x="276" y="328" width="80" height="30" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="316" y="343" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">仓位管理</text>
<rect x="366" y="328" width="80" height="30" rx="5" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
<text x="406" y="343" font-family="sans-serif" font-size="11" fill="#173404" text-anchor="middle" dominant-baseline="central">回测模拟</text>

<text x="480" y="312" font-family="sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">~0.5-2 us（优化后）</text>
<text x="480" y="328" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">常数时间决策路径</text>
<text x="480" y="344" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">预计算查表 · branchless</text>
<text x="480" y="360" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">热路径无虚函数调用</text>

<line x1="250" y1="370" x2="250" y2="388" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="388" width="420" height="52" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="406" font-family="sans-serif" font-size="12" font-weight="500" fill="#791F1F" dominant-baseline="central">风控层（不可绕过）</text>
<rect x="150" y="410" width="100" height="24" rx="5" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="200" y="422" font-family="sans-serif" font-size="11" fill="#501313" text-anchor="middle" dominant-baseline="central">仓位/频率限制</text>
<rect x="260" y="410" width="100" height="24" rx="5" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="310" y="422" font-family="sans-serif" font-size="11" fill="#501313" text-anchor="middle" dominant-baseline="central">撤单率/自成交</text>

<text x="480" y="400" font-family="sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">~0.05 us（优化后）</text>
<text x="480" y="416" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">O(1) 检查 · inline 内联</text>
<text x="480" y="432" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">无堆分配 · 无分支</text>

<line x1="250" y1="440" x2="250" y2="458" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="458" width="420" height="52" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="56" y="476" font-family="sans-serif" font-size="12" font-weight="500" fill="#633806" dominant-baseline="central">报单网关层</text>
<rect x="150" y="480" width="110" height="24" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="205" y="492" font-family="sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">报单编码/序列化</text>
<rect x="270" y="480" width="100" height="24" rx="5" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="320" y="492" font-family="sans-serif" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">网络发送(TCP)</text>

<text x="480" y="470" font-family="sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">~1 us（优化后）</text>
<text x="480" y="486" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">预填报单模板（只改价格/量）</text>
<text x="480" y="502" font-family="sans-serif" font-size="11" fill="#639922" dominant-baseline="central">内核旁路发送 · busy poll</text>

<line x1="250" y1="510" x2="250" y2="528" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="528" width="420" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250" y="548" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">交易所撮合引擎</text>
<text x="250" y="566" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">CTP/XTP/UFT 柜台 → 核心撮合</text>

<text x="480" y="542" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">~10-50 us（不可控）</text>
<text x="480" y="558" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">交易所内部延迟</text>
<text x="480" y="574" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">选低延迟柜台（UFT > CTP）</text>

<rect x="40" y="600" width="420" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="618" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041" dominant-baseline="central">基础设施层（离线/准实时）</text>
<rect x="56" y="630" width="80" height="28" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="96" y="644" font-family="sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">数据仓库</text>
<rect x="146" y="630" width="80" height="28" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="186" y="644" font-family="sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">回测框架</text>
<rect x="236" y="630" width="90" height="28" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="281" y="644" font-family="sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">策略研究平台</text>
<rect x="336" y="630" width="60" height="28" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="366" y="644" font-family="sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">监控</text>
<rect x="406" y="630" width="44" height="28" rx="5" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="428" y="644" font-family="sans-serif" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">运维</text>

<text x="480" y="618" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">非实时（ms~s 级）</text>
<text x="480" y="634" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">批量处理 · 异步写盘</text>
<text x="480" y="650" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">不在关键路径上</text>

<line x1="40" y1="694" x2="660" y2="694" stroke="#B4B2A9" stroke-width="0.5"/>

<rect x="40" y="710" width="620" height="90" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="56" y="730" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" dominant-baseline="central">全链路汇总（tick-to-order，你能控制的部分）</text>
<text x="56" y="748" font-family="sans-serif" font-size="12" fill="#A32D2D" dominant-baseline="central">未优化（纯软件，含内核网络栈）：~100 us</text>
<text x="56" y="764" font-family="sans-serif" font-size="12" fill="#639922" dominant-baseline="central">软件优化后（无锁+epoll+绑核，含网络IO）：~10-50 us</text>
<text x="56" y="780" font-family="sans-serif" font-size="11" fill="#888780" dominant-baseline="central">顶级 HFT（DPDK kernel bypass + co-location）：~3-5 us　← 需专用硬件，非本项目范围</text>
<text x="56" y="796" font-family="sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">MiniTrader：纯软件路线，目标纯计算路径（不含网络IO）tick-to-order &lt; 200 ns</text>
</svg>
