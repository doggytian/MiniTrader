name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Release 构建 + 常规测试（Ubuntu + macOS）────────────────────────
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake

          # Build GTest from source (libgtest-dev only ships headers+source)
          sudo apt-get install -y libgtest-dev
          cd /usr/src/googletest
          sudo cmake -B build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build build --parallel
          sudo cmake --install build

          # google-benchmark: build from source for reliable availability
          sudo apt-get install -y git
          git clone --depth 1 --branch v1.9.0 \
            https://github.com/google/benchmark.git /tmp/benchmark
          cmake -S /tmp/benchmark -B /tmp/benchmark/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBENCHMARK_ENABLE_TESTING=OFF
          cmake --build /tmp/benchmark/build --parallel
          sudo cmake --install /tmp/benchmark/build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install googletest google-benchmark

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DMINITRADER_BUILD_TESTS=ON \
            -DMINITRADER_BUILD_BENCH=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Job 2: Sanitizer 构建（仅 Ubuntu，TSan + ASan 各一次）─────────────────
  # ThreadSanitizer：捕获 SPSC 无锁队列的 data race（x86 TSO 下运行期不触发，
  #   但 TSan 按 C++ 内存模型静态分析，能发现 relaxed/release 误用）。
  # AddressSanitizer：捕获 cancel_order use-after-free 等内存错误。
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake libgtest-dev
          cd /usr/src/googletest
          sudo cmake -B build -DCMAKE_BUILD_TYPE=Debug
          sudo cmake --build build --parallel
          sudo cmake --install build

      - name: Configure (${{ matrix.sanitizer }}san)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMINITRADER_BUILD_TESTS=ON \
            -DMINITRADER_BUILD_BENCH=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (with ${{ matrix.sanitizer }}san)
        run: ctest --test-dir build --output-on-failure
        env:
          # TSan: 抑制 GTest 内部的已知误报
          TSAN_OPTIONS: "halt_on_error=1 suppressions="
          # ASan: 发现 leak 即报错
          ASAN_OPTIONS: "halt_on_error=1 detect_leaks=1"
